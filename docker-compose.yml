services:
  loki:
    image: grafana/loki:latest
    container_name: clinicflow-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/tmp/loki
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: clinicflow-pyroscope
    ports:
      - "4040:4040"
    command:
      - "server"
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: clinicflow-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - pyroscope
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: clinicflow-promtail
    ports:
      - "9080:9080"
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - ./logs:/var/log/clinicflow
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  pyroscope-data:
  grafana-data:
